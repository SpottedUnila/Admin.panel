<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Painel administrativo do Spotted Unila">
  <title>Spotted Unila — AdminPanel</title>
  <link rel="stylesheet" href="styles.css?v=20260914-1822">
</head>
<body>
  <section id="loginView" class="login-view">
    <div class="login-card">
      <div class="brand">Spotted / Unila · Firebase Auth</div>
      <h1>Admin <span>Panel</span></h1>
      <p class="muted">Área administrativa para textos, notícias, Conheça a Unila e moderação.</p>
      <form id="loginForm">
        <label for="email">E-mail autorizado</label>
        <input id="email" type="email" value="fernando2018a1986@gmail.com" required>
        <label for="password">Senha Firebase</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="loginButton" class="button primary-button" type="submit">Entrar no painel</button>
      </form>
      <div id="loginMsg" class="login-message" role="alert" aria-live="polite"></div>
    </div>
  </section>

  <section id="panelView" class="panel-layout hidden">
    <aside class="sidebar">
      <div class="brand">Spotted / Unila<br><span>AdminPanel</span></div>
      <nav aria-label="Navegação administrativa">
        <button class="nav-button active" data-page="home">Visão geral</button>
        <button class="nav-button" data-page="content">Textos e botões</button>
        <button class="nav-button" data-page="news">Notícias</button>
        <button class="nav-button" data-page="conheca">Conheça a Unila</button>
        <button class="nav-button" data-page="users">Usuários</button>
        <button class="nav-button" data-page="moderation">Moderação</button>
      </nav>
      <div id="account" class="account"></div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <div class="brand">PAINEL ADMINISTRATIVO</div>
          <h2 id="pageTitle">Visão geral</h2>
          <p id="pageDescription" class="muted">Conteúdos essenciais do aplicativo.</p>
        </div>
        <button id="logoutButton" class="button" type="button">Sair</button>
      </header>
      <div id="status" aria-live="polite"></div>
      <section id="homePage" class="page"></section>
      <section id="contentPage" class="page hidden"></section>
      <section id="newsPage" class="page hidden"></section>
      <section id="conhecaPage" class="page hidden"></section>
      <section id="usersPage" class="page hidden"></section>
      <section id="moderationPage" class="page hidden"></section>
    </main>
  </section>

  <script type="module" src="app.js?v=20260914-1822"></script>
</body>
</html>
