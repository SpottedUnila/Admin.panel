<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotted Unila — AdminPanel</title>
<style>
:root{--bg:#080b14;--card:#101827;--card2:#152239;--line:#2b3b59;--text:#f6f8ff;--muted:#9aa8bd;--pink:#ec55a5;--cyan:#4dd9e8;--red:#ff7184;--green:#56dfa1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#291845,#080b14 45%);color:var(--text);font:14px Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);padding:28px;background:#0d1422f2;border:1px solid #ec55a566;border-radius:16px;box-shadow:0 20px 80px #0009}.brand{color:var(--cyan);font-size:11px;font-weight:bold;letter-spacing:.14em;text-transform:uppercase}h1{font-size:31px;margin:18px 0 8px}h1 span{color:var(--pink)}h2{margin:4px 0;font-size:28px}h3{margin-top:0}.muted{color:var(--muted);line-height:1.5}label{display:block;color:#b8c5d8;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#080d17;color:var(--text);outline:0}textarea{min-height:130px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--cyan)}
.btn{border:1px solid var(--line);border-radius:8px;background:#16243b;color:var(--text);padding:10px 14px;font-weight:bold}.btn:hover{border-color:var(--cyan)}.primary{background:linear-gradient(135deg,#ef5cac,#bd369c);border:0}.danger{border-color:#ff718466;color:#ffd6dc}.btn:disabled{opacity:.6;cursor:wait}.actions{display:flex;gap:8px;flex-wrap:wrap}.msg{padding:11px;border-radius:8px;margin:0 0 15px;background:#ff71841a;color:#ffd1d8;line-height:1.45}.msg.ok{background:#56dfa11a;color:#baffdb}#loginMsg{display:none;margin-top:14px;padding:12px;border:1px solid var(--red);border-radius:8px;background:#3a1420;color:#ffd9df;line-height:1.45}#loginMsg:not(:empty){display:block}
.layout{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.sidebar{padding:20px 12px;background:#080e19ee;border-right:1px solid #ffffff12}.sidebar nav{display:grid;gap:6px;margin-top:25px}.nav{width:100%;text-align:left;border:1px solid transparent;border-radius:8px;background:transparent;color:#aebbd0;padding:11px}.nav:hover,.nav.active{background:#18253b;color:#fff;border-color:#49d9e833}.account{position:fixed;bottom:18px;color:var(--muted);font-size:11px;padding:0 12px}main{width:100%;max-width:1400px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{background:#101827dd;border:1px solid #ffffff12;border-radius:13px;padding:17px}.list{display:grid;gap:7px;max-height:620px;overflow:auto}.row{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--card2);border:1px solid #ffffff12;color:var(--text);padding:11px;border-radius:8px}.row:hover{border-color:var(--cyan)}.row strong,.row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:440px}.row small{color:var(--muted);margin-top:4px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #ffffff22;border-radius:8px}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:var(--card);border:1px solid #ffffff12;border-radius:12px;padding:15px}.metric strong{display:block;margin-top:7px;color:var(--cyan);font-size:24px}
@media(max-width:800px){.layout{display:block}.sidebar{border-right:0;border-bottom:1px solid #ffffff12}.sidebar nav{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}.account{display:none}main{padding:16px}.top{display:block}.top .actions{margin-top:12px}.grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<section id="loginView" class="login"><div class="login-card"><div class="brand">Spotted / Unila · Firebase Auth</div><h1>Admin <span>Panel</span></h1><p class="muted">Área administrativa para textos, notícias, Conheça a Unila e moderação.</p><form id="loginForm"><label for="email">E-mail autorizado</label><input id="email" type="email" value="fernando2018a1986@gmail.com" required><label for="password">Senha Firebase</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" class="btn primary" style="width:100%;margin-top:18px">Entrar no painel</button></form><div id="loginMsg" role="alert" aria-live="polite"></div></div></section>
<section id="panelView" class="layout hidden"><aside class="sidebar"><div class="brand">Spotted / Unila<br><span style="color:white">AdminPanel</span></div><nav><button class="nav active" data-page="home">Visão geral</button><button class="nav" data-page="content">Textos e botões</button><button class="nav" data-page="news">Notícias</button><button class="nav" data-page="conheca">Conheça a Unila</button><button class="nav" data-page="moderation">Moderação</button></nav><div id="account" class="account"></div></aside><main><header class="top"><div><div class="brand">PAINEL ADMINISTRATIVO</div><h2 id="pageTitle">Visão geral</h2><div id="pageDescription" class="muted">Conteúdos essenciais do aplicativo.</div></div><div class="actions"><button id="logoutButton" class="btn">Sair</button></div></header><div id="status"></div><section id="homePage" class="page"></section><section id="contentPage" class="page hidden"></section><section id="newsPage" class="page hidden"></section><section id="conhecaPage" class="page hidden"></section><section id="moderationPage" class="page hidden"></section></main></section>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import{getFirestore,collection,getDocs,doc,setDoc,deleteDoc,serverTimestamp,query,limit}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyDCm8jh-gz3T8OkOH2J6ls66t5QizcKwu8',authDomain:'app-unila.firebaseapp.com',projectId:'app-unila',storageBucket:'app-unila.firebasestorage.app',messagingSenderId:'574505875323',appId:'1:574505875323:web:fb885f0a2ae32b272fafde',measurementId:'G-FJT3X93608'};
const ADMIN_EMAIL='fernando2018a1986@gmail.com';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const $=id=>document.getElementById(id);let currentPage='home',currentUser=null,cache={};
const labelKeys=['home','podcast','music','chatMenu','portal','inscreva','sigaa','email','google','instagram','facebook','library','intercampus','notices','emergency','addresses','ru','group','developer','privacy','notes','share','internet','study','academicGoals','studentAid','mentalHealth','enem','news','conheca','desapega','upa'];
const contentKeys=['portal_unila','inscreva','sigaa','email','google','instagram','facebook','biblioteca','intercampi','editais','emergencia','enderecos','ru','dev','internet','estude','auxilio_estudantil','saude_mental','enem','grupo_facebook','noticias','upa'];const languages=['pt','fr','es'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(t,ok=false){$('status').innerHTML=t?`<div class="msg ${ok?'ok':''}">${esc(t)}</div>`:''}function allowed(u){return!!u&&u.email===ADMIN_EMAIL&&u.emailVerified!==false}
function errorText(e){const m={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/invalid-login-credentials':'E-mail ou senha incorretos.','auth/wrong-password':'A senha informada está incorreta.','auth/user-not-found':'Não existe uma conta Firebase com este e-mail.','auth/user-disabled':'Esta conta foi desativada no Firebase.','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.','auth/network-request-failed':'Falha de conexão.','auth/operation-not-allowed':'Login por e-mail e senha não está habilitado.','auth/invalid-email':'O formato do e-mail é inválido.'};return m[e?.code]||`Não foi possível entrar. Código: ${e?.code||'desconhecido'}.`}
function loginError(t){$('loginMsg').textContent=t;$('loginMsg').style.display='block'}function clearLoginError(){$('loginMsg').textContent='';$('loginMsg').style.display='none'}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();clearLoginError();const email=$('email').value.trim(),password=$('password').value;if(!email||!password){loginError('Digite o e-mail e a senha.');return}const b=$('loginButton');b.disabled=true;b.textContent='Verificando...';try{const r=await signInWithEmailAndPassword(auth,email,password);if(!allowed(r.user)){await signOut(auth);throw{code:'auth/not-authorized'}}}catch(err){$('password').value=password;loginError(err?.code==='auth/not-authorized'?'Esta conta não está autorizada para o AdminPanel.':errorText(err))}finally{b.disabled=false;b.textContent='Entrar no painel'}});
$('logoutButton').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{currentUser=u;if(allowed(u)){$('loginView').classList.add('hidden');$('panelView').classList.remove('hidden');$('account').textContent=u.email;openPage('home')}else if(u){signOut(auth);$('loginView').classList.remove('hidden');$('panelView').classList.add('hidden');loginError('Esta conta não está autorizada.')}else{$('loginView').classList.remove('hidden');$('panelView').classList.add('hidden')}});
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>openPage(b.dataset.page));
function openPage(p){currentPage=p;document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(p+'Page').classList.remove('hidden');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));const t={home:['Visão geral','Conteúdos essenciais do aplicativo.'],content:['Textos e botões','IDs button_label_* e button_content_* em PT, FR e ES.'],news:['Notícias','Publicações exibidas no aplicativo.'],conheca:['Conheça a Unila','Publicações da coleção conhecaUnila.'],moderation:['Moderação','Bloqueios e denúncias.']};$('pageTitle').textContent=t[p][0];$('pageDescription').textContent=t[p][1];if(p==='home')home();if(p==='content')content();if(p==='news')editor('news','newsPage','Notícias',[['title','Título'],['content','Conteúdo','textarea'],['imageUrl','URL da imagem'],['videoUrl','URL do vídeo']]);if(p==='conheca')editor('conhecaUnila','conhecaPage','Conheça a Unila',[['title','Título'],['content','Conteúdo','textarea'],['imageUrl','URL da imagem'],['videoUrl','URL do vídeo']]);if(p==='moderation')moderation()}
function home(){$('homePage').innerHTML=`<div class="metric-grid"><div class="metric"><span class="muted">Conta</span><strong>ADMIN</strong></div><div class="metric"><span class="muted">Rótulos</span><strong>${labelKeys.length*3}</strong></div><div class="metric"><span class="muted">Conteúdos</span><strong>${contentKeys.length*3}</strong></div></div><div class="card" style="margin-top:15px"><h3>Segurança</h3><p class="muted">A configuração Web do Firebase pode aparecer no navegador. A proteção real deve estar nas regras do Firebase. Nunca coloque senha ou chave privada neste arquivo.</p></div>`}
function ids(){return[...labelKeys.flatMap(k=>languages.map(l=>`button_label_${k}_${l}`)),...contentKeys.flatMap(k=>languages.map(l=>`button_content_${k}_${l}`))]}function parse(v){try{return JSON.parse(v)}catch{return v}}
async function read(name){const s=await getDocs(query(collection(db,name),limit(300)));return s.docs.map(x=>({id:x.id,...x.data()}))}async function save(name,id,data){await setDoc(doc(db,name,id),data,{merge:true});status('Registro salvo com sucesso.',true);openPage(currentPage)}async function remove(name,id){if(!confirm('Excluir este registro?'))return;await deleteDoc(doc(db,name,id));status('Registro excluído.',true);openPage(currentPage)}
async function content(){const items=await read('admin_content');cache=Object.fromEntries(items.map(x=>[x.id,x]));const all=[...new Set([...ids(),...items.map(x=>x.id)])];$('contentPage').innerHTML=`<div class="grid"><div class="card"><h3>Documentos <span class="muted">${items.length}</span></h3><input id="contentSearch" placeholder="Filtrar ID ou texto"><div id="contentList" class="list" style="margin-top:10px"></div></div><div class="card"><h3>Editar conteúdo</h3><form id="contentForm"><label>ID do documento</label><select id="contentId"><option value="">Escolha um ID</option>${all.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><label>ID personalizado</label><input id="customId" placeholder="opcional"><label>Valor</label><textarea id="contentValue"></textarea><div class="actions"><button class="btn primary">Salvar</button><button type="button" id="clearContent" class="btn">Limpar</button></div></form></div></div>`;const draw=()=>{$('contentList').innerHTML=all.filter(id=>(id+' '+(cache[id]?.value??'')).toLowerCase().includes($('contentSearch').value.toLowerCase())).map(id=>`<button class="row" data-id="${esc(id)}"><span><strong>${esc(id)}</strong><small>${esc(cache[id]?.value??'Sem valor')}</small></span>›</button>`).join('')||'<div class="empty">Nenhum documento.</div>';document.querySelectorAll('#contentList .row').forEach(r=>r.onclick=()=>{$('contentId').value=r.dataset.id;$('contentValue').value=typeof cache[r.dataset.id]?.value==='object'?JSON.stringify(cache[r.dataset.id].value,null,2):cache[r.dataset.id]?.value||''})};$('contentSearch').oninput=draw;draw();$('contentForm').onsubmit=async e=>{e.preventDefault();const id=$('customId').value.trim()||$('contentId').value;if(!id)return status('Informe um ID.');await save('admin_content',id,{value:parse($('contentValue').value)})};$('clearContent').onclick=()=>{$('contentId').value='';$('customId').value='';$('contentValue').value=''}}
async function editor(name,section,title,fields){const items=await read(name),el=$(section);el.innerHTML=`<div class="grid"><div class="card"><h3>${title} <span class="muted">${items.length}</span></h3><div class="list">${items.map(x=>`<button class="row" data-id="${esc(x.id)}"><span><strong>${esc(x.title||x.id)}</strong><small>${esc(x.content||'')}</small></span>›</button>`).join('')||'<div class="empty">Nenhum registro.</div>'}</div></div><div class="card"><h3>Editar registro</h3><form id="recordForm"><label>ID</label><input id="recordId" placeholder="vazio para criar"><div>${fields.map(f=>f[2]==='textarea'?`<label>${f[1]}</label><textarea id="f_${f[0]}"></textarea>`:`<label>${f[1]}</label><input id="f_${f[0]}">`).join('')}</div><div class="actions"><button class="btn primary">Salvar</button><button type="button" id="deleteCurrent" class="btn danger hidden">Excluir</button><button type="button" id="clearCurrent" class="btn">Limpar</button></div></form></div></div>`;items.forEach(x=>el.querySelector(`[data-id="${CSS.escape(x.id)}"]`)?.addEventListener('click',()=>{$('recordId').value=x.id;fields.forEach(f=>$('f_'+f[0]).value=x[f[0]]||'');$('deleteCurrent').classList.remove('hidden')}));$('recordForm').onsubmit=async e=>{e.preventDefault();const id=$('recordId').value.trim()||crypto.randomUUID(),data={};fields.forEach(f=>data[f[0]]=$('f_'+f[0]).value.trim());if(name==='news'){data.timestamp=serverTimestamp();data.createdAt=serverTimestamp()}await save(name,id,data)};$('deleteCurrent').onclick=()=>{const id=$('recordId').value.trim();if(id)remove(name,id)};$('clearCurrent').onclick=()=>openPage(currentPage)}
async function moderation(){$('moderationPage').innerHTML=`<div class="grid"><div class="card"><h3>Bloquear usuário</h3><form id="banForm"><label>UID ou identificador</label><input id="banId" required><label>Motivo</label><textarea id="banReason"></textarea><button class="btn danger">Salvar bloqueio</button></form></div><div class="card"><h3>Denúncias</h3><div id="reports" class="list">Carregando...</div></div></div>`;$('banForm').onsubmit=async e=>{e.preventDefault();await save('bannedUsers',$('banId').value.trim(),{reason:$('banReason').value.trim(),createdAt:serverTimestamp()})};const reports=await read('ugc_reports');$('reports').innerHTML=reports.map(x=>`<div class="row"><span><strong>${esc(x.type||'Denúncia')}</strong><small>${esc(x.text||x.reason||x.id)}</small></span></div>`).join('')||'<div class="empty">Nenhuma denúncia.</div>'}
</script>
</body>
</html>
